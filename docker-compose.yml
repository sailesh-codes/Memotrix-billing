version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: memotrix-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: memotrix-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://teammemotrix_db_user:3gKfLfcFJG002ecp@cluster0.3mygesv.mongodb.net/memotrix?retryWrites=true&w=majority&appName=Cluster0}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-memotrix}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-memotrix_jwt_secret_key_2026!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-memotrix_secret_key_32bytes_long!}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: memotrix-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
